<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#0c0b0d"><title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0c0b0d;--card:#17141a;--line:#2a2430;--tx:#f3e6dc;--dim:#a99b90;--or:#ff7a1a;--ok:#4ade80;--bad:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
h1{font-size:15px;letter-spacing:.28em;margin:0;flex:1;color:var(--or)}
#st{font-size:13px;color:var(--dim)} #dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block;margin-right:6px}
#dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} #dot.off{background:var(--bad)}
#out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:96px;max-height:34dvh;overflow:auto;white-space:pre-wrap}
#out .u{color:var(--dim)} #out .j{color:var(--tx);margin-bottom:8px}
.mic{display:flex;justify-content:center;margin:18px 0 8px}
#mic{width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffb066,var(--or) 55%,#b44a00);color:#111;font-size:34px;box-shadow:0 0 30px #ff7a1a66}
#mic.on{animation:pulse 1.1s infinite} @keyframes pulse{50%{box-shadow:0 0 56px #ff7a1acc;transform:scale(1.06)}}
form{display:flex;gap:8px;margin:8px 0 14px} input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;min-width:0}
.go{background:var(--or);color:#111;border:0;border-radius:12px;padding:0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .grid button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 8px;font:inherit}
.grid button.red{border-color:#ff5a5a66;color:#ff9a9a} .grid button:active{background:#241f29}
h2{font-size:12px;letter-spacing:.2em;color:var(--dim);margin:18px 0 8px}
#scr{width:100%;border-radius:12px;border:1px solid var(--line);display:none;margin-top:8px;background:#000}
.hint{color:var(--dim);font-size:13px;margin-top:10px}
</style></head><body>
<header><h1>JARVIS</h1><span id="st"><i id="dot"></i><span id="pc">verbinde …</span></span></header>
<div id="out"><div class="j">Hallo. Sag mir, was ich am PC tun soll.</div></div>
<div class="mic"><button id="mic" aria-label="Sprechen">🎙</button></div>
<form id="f"><input id="t" placeholder="oder hier tippen …" autocomplete="off" enterkeyhint="send"><button class="go">Senden</button></form>
<h2>PC</h2>
<div class="grid">
  <button data-p="lock">🔒 Sperren</button><button data-p="screenoff">🌙 Bildschirm aus</button>
  <button data-p="saver">🔋 Energie sparen</button><button data-p="performance">⚡ Höchstleistung</button>
  <button data-p="balanced">⚖ Ausbalanciert</button><button data-p="sleep">😴 Standby</button>
  <button data-p="restart" class="red">↻ Neustart</button><button data-p="shutdown" class="red">⏻ Herunterfahren</button>
  <button data-p="cancel" style="grid-column:span 2">✕ Herunterfahren abbrechen</button>
</div>
<h2>BILDSCHIRM</h2>
<div class="grid"><button id="scrBtn" style="grid-column:span 2">🖥 PC-Bildschirm live ansehen</button></div>
<img id="scr" alt="PC-Bildschirm">
<p class="hint" id="hint"></p>
<script>
const $=(i)=>document.getElementById(i);
// Koppel-Link: #t=SCHLUESSEL (&h=PC-ADRESSE, wenn die Seite woanders gehostet ist als der PC). Beides bleibt nur in diesem Browser.
let TOKEN='', HOST=''; try{ const mt=/[#&]t=([a-f0-9]{32,})/.exec(location.hash), mh=/[#&]h=([a-z0-9.\-]+)/i.exec(location.hash); if(mt) localStorage.setItem('jt',mt[1]); if(mh) localStorage.setItem('jh',mh[1]); if(mt||mh) history.replaceState(null,'',location.pathname); TOKEN=localStorage.getItem('jt')||''; HOST=localStorage.getItem('jh')||''; }catch{}
const BASE=HOST?('https://'+HOST):'';
const api=async(path,body,raw)=>{ const r=await fetch(BASE+'/api/remote/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}); if(raw) return r; return r.json(); };
const add=(cls,t)=>{ const d=document.createElement('div'); d.className=cls; d.textContent=t; $('out').appendChild(d); $('out').scrollTop=1e9; };
const speak=(t)=>{ try{ if(!t||!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; speechSynthesis.speak(u); }catch{} };
if(!TOKEN){ $('hint').textContent='Nicht gekoppelt: Auf dem PC im Tray „Handy koppeln …“ öffnen und den QR-Code scannen.'; $('pc').textContent='nicht gekoppelt'; $('dot').className='off'; }

async function ping(){ if(!TOKEN) return; try{ const j=await api('ping'); if(j.ok){ $('dot').className='on'; $('pc').textContent=j.pc+(j.pendingShutdown?' · fährt herunter ('+j.pendingShutdown.secondsLeft+' s)':''); } else { $('dot').className='off'; $('pc').textContent=j.error||'Fehler'; } }catch{ $('dot').className='off'; $('pc').textContent='PC nicht erreichbar'; } }
ping(); setInterval(ping,8000);

async function send(text){ text=text.trim(); if(!text) return; add('u','Du: '+text); add('j','…'); const last=$('out').lastChild;
  try{ const j=await api('cmd',{text}); last.textContent=j.ok?(j.say||'Erledigt.'):('⚠ '+j.error); if(j.ok) speak(j.say); }catch{ last.textContent='⚠ PC nicht erreichbar. Läuft er und ist Tailscale an?'; } ping(); }
$('f').onsubmit=(e)=>{ e.preventDefault(); const v=$('t').value; $('t').value=''; send(v); };

// Sprache: nur in Safari/Chrome-Tab, auf iOS im Home-Bildschirm-Modus oft nicht verfügbar -> dann die Mikrofon-Taste der iPhone-Tastatur im Textfeld nutzen
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
$('mic').onclick=()=>{ if(!SR){ $('hint').textContent='Spracheingabe geht hier nicht: tippe ins Textfeld und nutze das Mikrofon der Tastatur – oder sag „Hey Siri, Jarvis“.'; $('t').focus(); return; }
  if(rec){ rec.stop(); return; } rec=new SR(); rec.lang='de-DE'; rec.interimResults=false; rec.onstart=()=>$('mic').classList.add('on'); rec.onend=()=>{ $('mic').classList.remove('on'); rec=null; };
  rec.onresult=(e)=>send(e.results[0][0].transcript); rec.onerror=()=>{ $('mic').classList.remove('on'); rec=null; }; try{ rec.start(); }catch{ rec=null; } };

document.querySelectorAll('[data-p]').forEach((b)=>b.onclick=async()=>{ const a=b.dataset.p; if((a==='shutdown'||a==='restart')&&!confirm(a==='shutdown'?'PC wirklich herunterfahren? (15 Sekunden Verzug, abbrechbar)':'PC wirklich neu starten?')) return;
  const j=await api('power',{action:a}).catch(()=>({ok:false,error:'PC nicht erreichbar'})); add('j',j.ok?('✔ '+j.did):('⚠ '+j.error)); ping(); });

let scrOn=false, scrTimer=null;
async function frame(){ if(!scrOn) return; try{ const r=await api('screen',null,true); if(r.ok){ const b=await r.blob(); const old=$('scr').src; $('scr').src=URL.createObjectURL(b); if(old.startsWith('blob:')) URL.revokeObjectURL(old); } }catch{} scrTimer=setTimeout(frame,1200); }
$('scrBtn').onclick=()=>{ scrOn=!scrOn; $('scr').style.display=scrOn?'block':'none'; $('scrBtn').textContent=scrOn?'✕ Bildschirm ausblenden':'🖥 PC-Bildschirm live ansehen'; clearTimeout(scrTimer); if(scrOn) frame(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ scrOn=false; clearTimeout(scrTimer); $('scr').style.display='none'; $('scrBtn').textContent='🖥 PC-Bildschirm live ansehen'; } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
